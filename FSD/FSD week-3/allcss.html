<!DOCTYPE html>
<html>
    <head>
        <title>Types of CSS</title>

        <link rel="stylesheet" href="style.css">

        <style>
            p{
                color: green;
                font-size: 18px;
            }
        </style>
    </head>
    <body>
        <h1>External CSS example</h1>
        <p>Internal CSS applied to this paragraph</p>
        <div style="color: red;font-weight: bold;">
            Inline CSS example
        </div>
    </body>
</html>
