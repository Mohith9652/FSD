<!DOCTYPE html>
<html>
    <head>
        <title>Simple Selector</title>
        <style>
            p{
                color: blue;
            }

            #heading{
                color: red;
            }

            .note{
                background-color: yellow;
            }

            h2,h3{
                color: green;
            }

            *{
                font-family: Arial, Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">ID Selector</h1>

        <p>Element Selector Example</p>
        <p class="note">CLass Selector Example</p>

        <h2>Group Selector</h2>
        <h3>Group Selector</h3>
    </body>
</html>
