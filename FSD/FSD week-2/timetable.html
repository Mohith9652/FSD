<!DOCTYPE html>
<html>
    <head>
        <title>TimeTable example</title>
    </head>
    <body>

        <table border="2" cellpadding="10" cellspacing="5">
            <caption><b>II B.Tech CSE-Timetable</b></caption>

            <tr>
                <th>Day</th>
                <th>9:00-10:00</th>
                <th>10:00-11:00</th>
                <th>11:00-12:00</th>
                <th>12:00-1:00</th>
            </tr>
            <tr>
                <th>Monday</th>
                <td>Maths</td>
                <td>Physics</td>
                <td colspan="2">Lab</td>
            </tr>
            <tr>
                <th>Tuesday</th>
                <td>English</td>
                <td rowspan="2">Chemistry</td>
                <td>Maths</td>
                <td>Physics</td>
            </tr>
            <tr>
                <th>Wednesday</th>
                <td>Computer</td>
                <td colspan="2">Seminar</td>
            </tr>
        </table>
    </body>
</html>
